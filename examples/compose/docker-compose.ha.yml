#
# HA overlay (architecture.md): valkey-backed credential store shared
# by two proxy replicas. Replica A keeps forward_mode "rewrite"; replica B runs
# "resign" so both modes are exercised live.
#
#   make ha-up      # docker compose -f docker-compose.yml -f docker-compose.ha.yml ...
#
# OZPX_STORE_KEY is the AES-256 value-encryption key: fixed here for
# the lab only; production injects a real secret (the Helm chart uses a Secret).
services:
  valkey:
    image: valkey/valkey:8
    container_name: oidc-valkey
    # Internal only: no host port. The store holds (encrypted) credential
    # secrets; nothing outside the compose network needs to reach it.
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - oidc-net

  proxy:
    volumes:
      - ./config/proxy-config-ha.yaml:/etc/ozone-oidc-proxy/config.yaml:ro
    environment:
      OZPX_STORE_KEY: "MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=" # lab only
    depends_on:
      valkey:
        condition: service_healthy

  proxy-b:
    image: ozone-oidc-proxy:dev
    container_name: oidc-proxy-b
    volumes:
      - ./config/proxy-config-ha-b.yaml:/etc/ozone-oidc-proxy/config.yaml:ro
    environment:
      OZPX_STORE_KEY: "MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=" # lab only
    ports:
      - "9001:9000" # S3 + STS, replica B
      # Admin incl. the revocation DELETE, localhost only (see the base
      # compose file); scraped over the network, not this host bind.
      - "127.0.0.1:9091:9090" # admin (healthz/metrics/revocation), replica B
    depends_on:
      valkey:
        condition: service_healthy
      ozone-s3g:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - oidc-net
