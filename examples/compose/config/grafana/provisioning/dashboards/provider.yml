apiVersion: 1
providers:
  - name: ozone-oidc-proxy
    orgId: 1
    type: file
    disableDeletion: true
    allowUiUpdates: false
    options:
      # The committed dashboard JSON is mounted here by the compose overlay.
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
