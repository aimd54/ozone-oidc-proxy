#
# Scrapes the proxy admin listener (:9090 /metrics, architecture.md) and
# evaluates the shipped alert rules against it. Replicas are found by name
# rather than listed: proxy-b exists only under the HA overlay, and a listed
# target that is absent reads as a replica that is down, which the rules
# would report. The dashboard aggregates across whichever replicas exist.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts/ozone-oidc-proxy.rules.yml

scrape_configs:
  - job_name: ozone-oidc-proxy
    metrics_path: /metrics
    dns_sd_configs:
      - names: [proxy, proxy-b]
        type: A
        port: 9090
        refresh_interval: 10s
    relabel_configs:
      # Name each target after its service, not its container address.
      - source_labels: [__meta_dns_name]
        target_label: instance
        replacement: $1:9090
