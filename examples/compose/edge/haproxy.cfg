# TLS edge for the compose stack, models the production ingress (the
# operator's real edge is HAProxy with real certificates). TLS terminates
# here; everything behind it is the compose network.
#
# SigV4 constraint: clients sign the Host header, and the proxy re-derives
# the signature from the wire form; so the Host header must pass through
# UNTOUCHED. Adding unsigned headers (X-Forwarded-*) is harmless.
global
    log stdout format raw local0
    maxconn 1024

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    # Generous client/server timeouts: multipart parts and streaming
    # uploads hold the connection open.
    timeout client 300s
    timeout server 300s

# Re-resolve backend hostnames at runtime through Docker's embedded DNS:
# compose recreates containers (new IP) on image rebuilds, and a
# startup-only libc lookup would leave the backend permanently DOWN.
resolvers docker
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid      10s
    hold obsolete   10s
    hold refused    10s
    hold nx         10s
    hold timeout    10s
    hold other      10s

frontend s3_sts_tls
    bind :8443 ssl crt /usr/local/etc/haproxy/certs/edge.pem
    http-request set-header X-Forwarded-Proto https
    default_backend oidc_proxy

backend oidc_proxy
    # A server is healthy only while it refuses an anonymous request with the
    # proxy's own message. With strict mode off the request would reach
    # Ozone, which can answer 403 as well; the edge then stops routing to
    # that server and answers 503, rather than carry anonymous traffic.
    option httpchk
    http-check send meth GET uri /
    http-check expect string "authentication required"
    # One backend server in the base stack; with the HA overlay running,
    # `server proxy2 proxy-b:9000 check inter 10s resolvers docker init-addr libc,none`
    # would balance both replicas.
    server proxy1 proxy:9000 check inter 10s resolvers docker init-addr libc,none
