# Lint, unit tests, chart rendering, a binary build and a vulnerability scan.
# The end-to-end suite (make e2e) needs Docker plus a full Ozone + Keycloak
# stack (~6 GB RAM), so it stays a local step; its results are recorded in
# docs/VERIFICATION.md.
name: CI

# Documentation-only changes skip this workflow entirely; markdown linting
# lives in docs.yml, which claims the same paths this one ignores. A change
# touching both docs and code still runs here, because a path filter only
# skips when every changed file matches it.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
  # Re-runnable by hand. A path filter or an outage can leave a commit with no
  # run against it, and a release should never be cut from an unverified one.
  workflow_dispatch:

# Default to no permissions; each job requests exactly what it needs.
permissions: {}

# Runners are pinned to a specific image rather than ubuntu-latest: GitHub
# migrates that alias on its own schedule, which can change the toolchain
# under a build with no commit here. Dependabot does not track runs-on, so
# bump it deliberately when GitHub announces an image deprecation.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # Part of the binary cache key below. Dependabot does not watch this,
      # so bump it by hand.
      GOLANGCI_LINT_VERSION: v2.12.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Resolve the toolchain for the cache key
        id: toolchain
        run: echo "version=$(go env GOVERSION)" >> "$GITHUB_OUTPUT"
      # The linter is built from source rather than downloaded, so that its
      # own Go version can never be older than the one this module targets:
      # a prebuilt binary refuses to analyse a newer target. Building it costs
      # ~70s, so cache the result on the linter version plus the toolchain
      # that produced it, which are the only things that change the output.
      - name: Cache golangci-lint
        id: lint-bin
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ozpx-lint-bin
          key: golangci-lint-${{ runner.os }}-${{ runner.arch }}-${{ env.GOLANGCI_LINT_VERSION }}-${{ steps.toolchain.outputs.version }}
      - name: Build golangci-lint
        if: steps.lint-bin.outputs.cache-hit != 'true'
        run: |
          GOBIN="$HOME/.cache/ozpx-lint-bin" \
            go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@$GOLANGCI_LINT_VERSION"
      - name: Put golangci-lint on PATH
        run: echo "$HOME/.cache/ozpx-lint-bin" >> "$GITHUB_PATH"
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # The binary is already on PATH, from the cache or the step above.
          install-mode: none
          version: ${{ env.GOLANGCI_LINT_VERSION }}

  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Format, vet, tidy, race-enabled unit tests
        run: make fmt-check vet tidy-check test

  helm:
    name: Helm chart
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Lint and render the chart
        run: |
          helm lint deploy/helm/ozone-oidc-proxy
          # Both shapes: without the S3 Gateway selector (no lockdown policy)
          # and with it (the production shape).
          helm template smoke deploy/helm/ozone-oidc-proxy > /dev/null
          helm template smoke deploy/helm/ozone-oidc-proxy \
            --set networkPolicy.s3gPodSelector.app=ozone-s3g > /dev/null

  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [test]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Tags are needed so the binaries carry a `git describe` version.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make build
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: binaries
          path: bin/
          retention-days: 7

  govulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Scan with current stable Go: govulncheck checks the *standard
          # library* of the toolchain in use, and our go.mod minimum may have
          # stdlib CVEs fixed in later patch releases.
          go-version: stable
      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...
