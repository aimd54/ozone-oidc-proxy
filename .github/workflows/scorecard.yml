# OpenSSF Scorecard supply-chain security analysis.
# Results feed the badge in README.md and the repo's code-scanning tab.

name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 2 * * 1' # weekly, Monday 02:30 UTC
  branch_protection_rule:

# Default to no permissions; the job requests exactly what it needs.
permissions: {}

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
      id-token: write # publish results to the OpenSSF REST API (badge)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: results.sarif
