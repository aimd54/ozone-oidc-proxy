# Markdown linting, split out from the CI workflow so that documentation
# changes do not drag the Go build, test, and interop suites along with them.
# CI ignores the same paths this workflow claims, so exactly one of the two
# runs for a documentation-only change and both run for a mixed one.

name: Docs

on:
  push:
    branches: [main]
    paths:
      - "**.md"
      - "docs/**"
      - ".markdownlint-cli2.yaml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "**.md"
      - "docs/**"
      - ".markdownlint-cli2.yaml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# Default to no permissions; the job requests exactly what it needs.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-docs:
    name: Lint docs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: "**/*.md"
