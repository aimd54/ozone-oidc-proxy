name: Feature request
description: Propose an enhancement
labels: ["kind/feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the use case, not only the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: >
        Including what Ozone can already do natively (native ACLs, Ranger,
        the upstream STS work tracked in docs/upstream.md) and why it does
        not cover this.
