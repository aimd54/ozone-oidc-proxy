name: Bug report
description: Something misbehaves
labels: ["kind/bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please do not paste tokens, secret keys or session tokens. Access key
        IDs (`OZPX...`) and usernames are fine and usually enough.
        Suspected security issues go through private reporting instead — see
        SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. aws sts assume-role-with-web-identity --endpoint-url ...
        2. aws s3 cp ... --endpoint-url ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: >
        Proxy version (or commit), Ozone version, identity provider and
        version, client (aws cli / boto3 / s3a / mc) and version, deployment
        shape (compose stack, Helm, other).
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: >
        Proxy logs around the failure (they are JSON, one object per request)
        and the S3/STS error XML the client received.
      render: text
