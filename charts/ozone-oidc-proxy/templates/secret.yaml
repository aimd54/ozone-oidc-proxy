{{- if and .Values.storeKey.create (not .Values.storeKey.existingSecret) }}
# Lab convenience only (values.storeKey.create). Production: create the
# Secret out of band and set storeKey.existingSecret.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ozone-oidc-proxy.storeKeySecret" . }}
  labels:
    {{- include "ozone-oidc-proxy.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.storeKey.secretKey }}: {{ required "storeKey.value is required when storeKey.create is true" .Values.storeKey.value | quote }}
{{- end }}
