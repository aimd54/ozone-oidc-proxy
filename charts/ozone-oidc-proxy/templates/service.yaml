apiVersion: v1
kind: Service
metadata:
  name: {{ include "ozone-oidc-proxy.fullname" . }}
  labels:
    {{- include "ozone-oidc-proxy.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "ozone-oidc-proxy.proxySelectorLabels" . | nindent 4 }}
  ports:
    - name: s3
      port: {{ .Values.service.s3Port }}
      targetPort: s3
    - name: admin
      port: {{ .Values.service.adminPort }}
      targetPort: admin
