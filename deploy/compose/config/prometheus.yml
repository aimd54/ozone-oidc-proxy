#
# Scrapes the proxy admin listener (:9090 /metrics, DESIGN.md §8). Both
# replicas are listed; proxy-b is only up under the HA overlay, so it simply
# reads DOWN otherwise — the dashboard aggregates across instances either way.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: ozone-oidc-proxy
    metrics_path: /metrics
    static_configs:
      - targets: [proxy:9090]
        labels:
          replica: a
      - targets: [proxy-b:9090]
        labels:
          replica: b
