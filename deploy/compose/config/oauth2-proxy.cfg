# oauth2-proxy in front of the credential portal (DESIGN.md §5.2, §11.4):
# handles the OIDC browser login against Keycloak and forwards the user's
# access token to the portal, which exchanges it at the proxy's STS.
#
# The issuer is http://keycloak:8080 (pinned KC_HOSTNAME, §"issuer
# consistency"), so the login redirect sends the browser to keycloak:8080 —
# a human's machine needs `127.0.0.1 keycloak` in /etc/hosts; the e2e suite
# uses curl --resolve instead.

http_address = "0.0.0.0:4180"
reverse_proxy = true

provider = "oidc"
provider_display_name = "Keycloak"
oidc_issuer_url = "http://keycloak:8080/realms/ozone"
redirect_url = "http://localhost:4180/oauth2/callback"
scope = "openid profile email"
email_domains = ["*"]
skip_provider_button = true

# Client id/secret and the cookie secret come from the environment
# (OAUTH2_PROXY_CLIENT_ID / _CLIENT_SECRET / _COOKIE_SECRET).

cookie_secure = false      # PoC is plain HTTP
cookie_httponly = true
cookie_samesite = "lax"
# Re-redeem the session (fresh access token) before Keycloak's 1h token
# lifespan runs out, so a reloaded portal page keeps working.
cookie_refresh = "50m"

upstreams = ["http://credential-portal:8090"]

# The portal needs the raw access token (aud=ozone-s3) and the username.
pass_access_token = true
pass_user_headers = true

skip_auth_routes = ["GET=^/healthz$"]

standard_logging = true
auth_logging = true
request_logging = false
