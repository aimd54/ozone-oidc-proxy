apiVersion: v2
name: ozone-oidc-proxy
description: >-
  OIDC authentication proxy for the Apache Ozone S3 Gateway: AWS-compatible
  STS token exchange, SigV4 verification against minted temporary
  credentials, Bearer JWT data path, strict mode. See DESIGN.md in the
  repository for the architecture; §7 for the trust boundary the bundled
  NetworkPolicies implement.
type: application
version: 0.1.0
appVersion: "0.3.0"
