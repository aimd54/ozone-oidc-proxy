version: "2"

linters:
  default: standard
  enable:
    - copyloopvar
    - errorlint
    - gosec
    - misspell
    - unconvert
    - whitespace
  settings:
    errcheck:
      # Writes of an HTTP response body or of terminal output: a failed write
      # means the peer is gone, which no handler here can act on.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
  exclusions:
    generated: lax
    rules:
      # Tests exercise expired credentials, tampered signatures and fixed
      # temp paths on purpose; the security linter cannot tell those from
      # the real thing.
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/aimd54/ozone-oidc-proxy
